[project]
name = "atom-pi"
version = "1.0.0rc2"
requires-python = ">=3.10"
dependencies = ["tzdata>=2025.2"]

[project.optional-dependencies]
runtime = ["numpy>=1.26,<3", "PyAudio>=0.2.14,<1", "requests>=2.32,<3", "websocket-client>=1.8,<2", "openwakeword==0.6.0"]
dev = ["ruff==0.12.8", "pip-audit==2.9.0"]

[tool.setuptools]
py-modules = ["atom_brief", "atom_jobs", "atom_safety", "atom_knowledge", "atom_doctor", "vision_describe", "wakeword_listener", "record_dataset", "validate_model", "apply_patches"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

